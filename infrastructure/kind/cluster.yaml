# Single-node kind cluster used for local and CI demonstrations.
# Port 8080 on the host reaches the ingress controller; 8081 reaches Argo CD.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: civicpulse
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
