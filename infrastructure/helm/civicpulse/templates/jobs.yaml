{{- if .Values.migrations.enabled }}
{{- /* Runs before the new version starts. Argo CD runs Helm pre-install/pre-upgrade hooks as PreSync. */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Release.Revision }}
  labels: {{- include "cp.labels" (dict "name" "migrate" "root" .) | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # The database may still be starting: keep retrying instead of failing the release.
  backoffLimit: 30
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "migrate" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {{- include "cp.podSecurity" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "cp.image" (dict "name" "api" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: database-url } }
          securityContext: {{- include "cp.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
{{- if .Values.seed.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-{{ .Release.Revision }}
  labels: {{- include "cp.labels" (dict "name" "seed" "root" .) | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "seed" "root" .) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {{- include "cp.podSecurity" . | nindent 8 }}
      containers:
        - name: seed
          image: {{ include "cp.image" (dict "name" "api" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/seed.js"]
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env:
            {{- include "cp.env" . | nindent 12 }}
            - { name: ALLOW_DEMO_SEED, value: "true" }
            - name: SEED_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: seed-password } }
          securityContext: {{- include "cp.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
