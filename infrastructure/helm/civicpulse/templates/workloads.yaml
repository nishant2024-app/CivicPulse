{{- /* api, workers and web share one shape; each differs in image, port, probes and env. */}}
{{- $configHash := include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
{{- range $name := list "api" "workers" }}
{{- $port := ternary 4000 4100 (eq $name "api") }}
{{- $values := index $.Values $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "cp.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  selector: {{- include "cp.selector" (dict "name" $name "root" $) | nindent 4 }}
  ports:
    - { name: http, port: {{ $port }}, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "cp.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  {{- if not (and $.Values.autoscaling.enabled (eq $name "api")) }}
  replicas: {{ $values.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" $name "root" $) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" $name "root" $) | nindent 8 }}
      annotations:
        checksum/config: {{ $configHash }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $port | quote }}
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "cp.podSecurity" $ | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: {{ include "cp.image" (dict "name" $name "root" $) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: civicpulse-config }
          env:
            {{- include "cp.env" $ | nindent 12 }}
            {{- if eq $name "api" }}
            - { name: PORT, value: "4000" }
            {{- else }}
            - { name: WORKER_PORT, value: "4100" }
            {{- end }}
          ports:
            - { name: http, containerPort: {{ $port }} }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 4
          securityContext: {{- include "cp.containerSecurity" $ | nindent 12 }}
          resources: {{- toYaml $values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "cp.labels" (dict "name" "web" "root" .) | nindent 4 }}
spec:
  selector: {{- include "cp.selector" (dict "name" "web" "root" .) | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "cp.labels" (dict "name" "web" "root" .) | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" "web" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "web" "root" .) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- include "cp.podSecurity" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "cp.image" (dict "name" "web" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 15
            initialDelaySeconds: 10
          securityContext: {{- include "cp.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            - { name: cache, mountPath: /app/apps/web/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
{{- if .Values.autoscaling.enabled }}
{{- range $name := list "api" "web" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "cp.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $.Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name := list "api" "web" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "cp.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" $name "root" $) | nindent 6 }}
{{- end }}
{{- end }}
