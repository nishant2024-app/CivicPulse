{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "cp.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
spec:
  selector: {{- include "cp.selector" (dict "name" "postgres" "root" .) | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "cp.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" "postgres" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "postgres" "root" .) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "max_connections=100", "-c", "shared_buffers=128MB"]
          env:
            - { name: POSTGRES_USER, value: civicpulse }
            - { name: POSTGRES_DB, value: civicpulse }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "civicpulse", "-d", "civicpulse"] }
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "civicpulse", "-d", "civicpulse"] }
            periodSeconds: 20
            initialDelaySeconds: 30
          securityContext: {{- include "cp.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "cp.labels" (dict "name" "redis" "root" .) | nindent 4 }}
spec:
  selector: {{- include "cp.selector" (dict "name" "redis" "root" .) | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "cp.labels" (dict "name" "redis" "root" .) | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" "redis" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "redis" "root" .) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Queues must never lose jobs to eviction: noeviction, and no persistence needed for a cache.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "{{ .Values.redis.maxMemory }}", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 15
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
{{- end }}
{{- if .Values.kafka.enabled }}
---
# Headless: broker addresses are stable DNS names, which Kafka clients are told to use.
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {{- include "cp.labels" (dict "name" "kafka" "root" .) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "cp.selector" (dict "name" "kafka" "root" .) | nindent 4 }}
  ports:
    - { name: broker, port: 9092, targetPort: 9092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {{- include "cp.labels" (dict "name" "kafka" "root" .) | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" "kafka" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "kafka" "root" .) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - { name: broker, containerPort: 9092 }
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # KRaft: one node is both broker and controller. No ZooKeeper.
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.$(POD_NAMESPACE).svc.cluster.local:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heap | quote }} }
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 20
            initialDelaySeconds: 60
          securityContext: {{- include "cp.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.kafka.storage }} } }
{{- end }}
{{- if .Values.opensearch.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  labels: {{- include "cp.labels" (dict "name" "opensearch" "root" .) | nindent 4 }}
spec:
  selector: {{- include "cp.selector" (dict "name" "opensearch" "root" .) | nindent 4 }}
  ports:
    - { name: http, port: 9200, targetPort: 9200 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  labels: {{- include "cp.labels" (dict "name" "opensearch" "root" .) | nindent 4 }}
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" "opensearch" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "opensearch" "root" .) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          ports:
            - { name: http, containerPort: 9200 }
          env:
            - { name: discovery.type, value: single-node }
            # The cluster is reachable only inside the namespace. Turning the security plugin
            # off keeps the demo simple; production should enable TLS and authentication.
            - { name: DISABLE_SECURITY_PLUGIN, value: "true" }
            - { name: DISABLE_INSTALL_DEMO_CONFIG, value: "true" }
            - { name: OPENSEARCH_JAVA_OPTS, value: {{ .Values.opensearch.heap | quote }} }
            # Avoids needing the privileged vm.max_map_count sysctl on the node.
            - { name: node.store.allow_mmap, value: "false" }
            - { name: cluster.routing.allocation.disk.threshold_enabled, value: "false" }
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: 9200 }
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            tcpSocket: { port: 9200 }
            periodSeconds: 20
            initialDelaySeconds: 90
          securityContext: {{- include "cp.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.opensearch.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /usr/share/opensearch/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.opensearch.storage }} } }
{{- end }}
{{- if .Values.seaweedfs.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  labels: {{- include "cp.labels" (dict "name" "seaweedfs" "root" .) | nindent 4 }}
spec:
  selector: {{- include "cp.selector" (dict "name" "seaweedfs" "root" .) | nindent 4 }}
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels: {{- include "cp.labels" (dict "name" "seaweedfs" "root" .) | nindent 4 }}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" "seaweedfs" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "seaweedfs" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          command: ["weed"]
          args:
            - server
            - -dir=/data
            - -volume.max=32
            - -master.volumeSizeLimitMB=128
            - -s3
            - -s3.config=/config/s3.json
            - -s3.port=8333
            - -ip.bind=0.0.0.0
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: 8333 }
            periodSeconds: 20
            initialDelaySeconds: 30
          securityContext: {{- include "cp.containerSecurity" . | nindent 12 }}
          resources: {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /config, readOnly: true }
      volumes:
        - name: s3-config
          secret:
            secretName: {{ .Values.existingSecret }}
            items:
              - { key: s3-config.json, path: s3.json }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.seaweedfs.storage }} } }
{{- end }}
{{- if .Values.mailpit.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels: {{- include "cp.labels" (dict "name" "mailpit" "root" .) | nindent 4 }}
spec:
  selector: {{- include "cp.selector" (dict "name" "mailpit" "root" .) | nindent 4 }}
  ports:
    - { name: smtp, port: 1025, targetPort: 1025 }
    - { name: http, port: 8025, targetPort: 8025 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {{- include "cp.labels" (dict "name" "mailpit" "root" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cp.selector" (dict "name" "mailpit" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cp.labels" (dict "name" "mailpit" "root" .) | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mailpit
