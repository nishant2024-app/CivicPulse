# OpenTelemetry Collector: receives OTLP from the API and workers, forwards traces to Jaeger,
# and derives request-rate / error / latency metrics from the spans for Prometheus.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 160
    spike_limit_mib: 40
  batch:
    timeout: 1s

connectors:
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      explicit:
        buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    dimensions:
      - name: http.route
      - name: http.response.status_code

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, spanmetrics]
    metrics/spans:
      receivers: [spanmetrics]
      processors: [batch]
      exporters: [prometheus]
